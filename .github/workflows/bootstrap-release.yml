name: Bootstrap Public Release

on:
  push:
    branches: [main]
    paths:
      - release-bootstrap.json
      - .github/workflows/bootstrap-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create first public release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r '.tag' release-bootstrap.json)
          TITLE=$(jq -r '.title' release-bootstrap.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            compatibility.json app-config.json ui-feed.json
